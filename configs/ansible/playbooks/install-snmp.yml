
---
- name: Install and configure SNMP
  hosts: web1,db1,branch-client
  become: true

  vars:
    snmp_community: public

  tasks:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install SNMP packages
      ansible.builtin.apt:
        name:
          - snmp
          - snmpd
        state: present

    - name: Configure SNMP community
      ansible.builtin.copy:
        dest: /etc/snmp/snmpd.conf
        content: |
          agentAddress udp:161
          rocommunity {{ snmp_community }} 0.0.0.0/0
        mode: "0644"

    - name: Start SNMP service
      ansible.builtin.command: service snmpd start
      register: snmp_start
      changed_when: snmp_start.rc == 0

